backend:
  name: github
  repo: mikayyy/mikemunozland
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  auth_scope: public_repo
  site_domain: mikemunozland.com
  squash_merges: true
  preview_context: netlify/lovely-semolina-caf3a0/deploy-preview
publish_mode: editorial_workflow
site_url: https://mikemunozland.com
display_url: https://mikemunozland.com/motes/
media_folder: public/uploads/motes
public_folder: /uploads/motes
collections:
  - name: motes
    label: Motes
    label_singular: Mote
    folder: src/content/motes
    create: true
    identifier_field: slug
    slug: "{{fields.slug}}"
    preview_path: "motes/{{slug}}/"
    summary: "{{publishedAt}} · {{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - {
          name: slug,
          label: URL name,
          widget: string,
          hint: "The end of your post’s web address: a-song-for-monday becomes /motes/a-song-for-monday/. Use a unique name with lowercase words and hyphens; keep it unchanged after publishing.",
          pattern:
            [
              "^(?!page$|rss$|index$)[a-z0-9]+(?:-[a-z0-9]+)*$",
              "Use a unique address such as a-small-ai-experiment.",
            ],
        }
      - {
          name: title,
          label: Heading,
          widget: string,
          required: false,
          default: "",
        }
      - {
          name: publishedAt,
          label: Publication date,
          widget: datetime,
          format: "YYYY-MM-DDTHH:mm:ssZ",
        }
      - { name: sample, label: Sample only, widget: hidden, default: false }
      - {
          name: topics,
          label: Topics,
          widget: select,
          multiple: true,
          required: false,
          max: 2,
          options: [Making, Listening, Learning, Life],
          default: [],
          hint: "Optional: choose up to two labels. Making = projects; Listening = music; Learning = ideas and professional interests; Life = personal stories. Everything stays in one feed.",
        }
      - {
          name: body,
          label: Your words,
          widget: markdown,
          minimal: true,
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              quote,
              bulleted-list,
              numbered-list,
            ],
          editor_components: [],
          hint: "Write a few sentences or a longer story. Add images, YouTube videos, or Spotify players in the next section.",
        }
      - {
          name: summary,
          label: Short excerpt,
          widget: text,
          required: false,
          default: "",
          hint: "Optional. Otherwise the homepage excerpt comes from your writing.",
        }
      - {
          name: type,
          label: Post style,
          widget: select,
          options: [note, link],
          default: note,
          hint: "Leave note selected for your own writing, including music posts. Choose link when discussing an external article or post; then fill in its source link and title below.",
        }
      - {
          name: sourceUrl,
          label: Source link,
          widget: mote-source,
          required: false,
          hint: "The article or post you’re discussing. LinkedIn posts embed automatically; other sources appear as a clickable link. For a playable YouTube video or Spotify track/playlist, use Add images or players instead. You do not need the same link in both places.",
        }
      - {
          name: sourceTitle,
          label: Source title,
          widget: string,
          required: false,
          default: "",
          hint: "Required when Post style is link.",
        }
      - name: media
        label: Add images or players
        widget: list
        hint: "Optional: upload an image or short audio/video, or add a normal YouTube or Spotify URL for a playable embed. Tracks and playlists work; YouTube and Spotify do not need embed code."
        required: false
        min: 0
        max: 8
        default: []
        types:
          - name: embed
            label: YouTube / Spotify / LinkedIn
            widget: object
            fields:
              - { name: url, label: Link, widget: mote-source }
              - {
                  name: embedCode,
                  label: LinkedIn embed code,
                  widget: text,
                  required: false,
                  default: "",
                }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  default: "",
                }
          - name: image
            label: Image
            widget: object
            fields:
              - name: file
                label: Image (5 MB max)
                widget: image
                choose_url: false
                media_library:
                  { config: { max_file_size: 5000000, multiple: false } }
              - { name: alt, label: Image description, widget: string }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  default: "",
                }
          - name: video
            label: Short video
            widget: object
            fields:
              - name: file
                label: MP4 video (10 MB max)
                widget: file
                choose_url: false
                media_library:
                  { config: { max_file_size: 10000000, multiple: false } }
              - { name: label, label: Video title, widget: string }
              - {
                  name: transcript,
                  label: Text alternative,
                  widget: text,
                  required: false,
                  default: "",
                  hint: "Include a transcript for speech and a description of important visual information.",
                }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  default: "",
                }
          - name: audio
            label: Short audio
            widget: object
            fields:
              - name: file
                label: MP3 / M4A audio (5 MB max)
                widget: file
                choose_url: false
                media_library:
                  { config: { max_file_size: 5000000, multiple: false } }
              - { name: label, label: Audio title, widget: string }
              - {
                  name: transcript,
                  label: Transcript / description,
                  widget: text,
                }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  default: "",
                }
      - { name: updatedAt, label: Updated date, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ", hint: "Optional: record when you revised a published Mote." }
      - { name: draft, label: Hide from the live website, widget: boolean, default: false, hint: "Leave off for normal publishing. Saving a draft already keeps it unpublished. Turn on to withdraw a published Mote. Future dates do not schedule a build." }
      - { name: linkedinEmbed, label: LinkedIn embed code (fallback), widget: text, required: false, default: "", hint: "Use only if the Source link does not show the LinkedIn post. Paste its official Embed this post code. YouTube and Spotify do not need this." }
      - { name: conversationUrl, label: LinkedIn conversation, widget: string, required: false, hint: "Optional: adds a Join the conversation on LinkedIn button pointing to this URL." }
